      # ============================================================

      - name: Criar FloatingBubbleService
        shell: bash
        run: |
          cat > proj/app/src/main/java/com/tomo/agentev8/overlay/FloatingBubbleService.kt <<'EOF'
          package com.tomo.agentev8.overlay

          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.Build
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import com.tomo.agentev8.R
          import com.tomo.agentev8.voice.V8VoiceService
          import kotlin.math.abs

          class FloatingBubbleService :
              Service() {

              private var manager:
                  WindowManager? = null

              private var bubble:
                  TextView? = null

              private var params:
                  WindowManager.LayoutParams? = null

              override fun onStartCommand(
                  intent: Intent?,
                  flags: Int,
                  startId: Int
              ): Int {

                  createBubble()

                  return START_STICKY
              }

              private fun createBubble() {

                  if (
                      bubble != null
                  ) {
                      return
                  }

                  if (
                      !Settings.canDrawOverlays(
                          this
                      )
                  ) {
                      return
                  }

                  manager =
                      getSystemService(
                          WINDOW_SERVICE
                      ) as WindowManager

                  val type =
                      if (
                          Build.VERSION.SDK_INT >= 26
                      ) {
                          WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                      } else {
                          WindowManager.LayoutParams.TYPE_PHONE
                      }

                  params =
                      WindowManager.LayoutParams(
                          64,
                          64,
                          type,
                          WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                          PixelFormat.TRANSLUCENT
                      )

                  params?.gravity =
                      Gravity.TOP or Gravity.START

                  params?.x = 24

                  params?.y = 260

                  bubble =
                      TextView(this).apply {

                          text = "V8"

                          textSize = 14f

                          gravity =
                              Gravity.CENTER

                          setTextColor(
                              Color.WHITE
                          )

                          setBackgroundResource(
                              R.drawable.v8_bubble
                          )

                          elevation = 18f

                          isClickable = true

                          setOnClickListener {

                              activateVoice()
                          }
                      }

                  var downX = 0f
                  var downY = 0f

                  var originalX = 0
                  var originalY = 0

                  var moving = false

                  bubble?.setOnTouchListener {
                      view,
                      event ->

                      when (
                          event.actionMasked
                      ) {

                          MotionEvent.ACTION_DOWN -> {

                              downX =
                                  event.rawX

                              downY =
                                  event.rawY

                              originalX =
                                  params?.x ?: 0

                              originalY =
                                  params?.y ?: 0

                              moving = false

                              true
                          }

                          MotionEvent.ACTION_MOVE -> {

                              val dx =
                                  event.rawX - downX

                              val dy =
                                  event.rawY - downY

                              if (
                                  abs(dx) > 8 ||
                                  abs(dy) > 8
                              ) {
                                  moving = true
                              }

                              params?.x =
                                  originalX +
                                  dx.toInt()

                              params?.y =
                                  originalY +
                                  dy.toInt()

                              params?.let {
                                  manager?.updateViewLayout(
                                      view,
                                      it
                                  )
                              }

                              true
                          }

                          MotionEvent.ACTION_UP -> {

                              if (!moving) {
                                  view.performClick()
                              }

                              true
                          }

                          else -> true
                      }
                  }

                  manager?.addView(
                      bubble,
                      params
                  )
              }

              private fun activateVoice() {

                  val intent =
                      Intent(
                          this,
                          V8VoiceService::class.java
                      ).apply {

                          action =
                              V8VoiceService.ACTION_START_LISTENING
                      }

                  if (
                      Build.VERSION.SDK_INT >= 26
                  ) {

                      startForegroundService(
                          intent
                      )

                  } else {

                      startService(
                          intent
                      )
                  }
              }

              override fun onDestroy() {

                  bubble?.let {

                      try {

                          manager?.removeView(
                              it
                          )

                      } catch (
                          _: Exception
                      ) {
                      }
                  }

                  bubble = null

                  super.onDestroy()
              }

              override fun onBind(
                  intent: Intent?
              ): IBinder? {

                  return null
              }
          }
          EOF

