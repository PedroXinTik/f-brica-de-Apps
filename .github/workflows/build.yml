name: Agente V8 - Build Completo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. PREPARAÇÃO
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      # ============================================================
      # 2. CRIAR ESTRUTURA
      # ============================================================

      - name: Criar estrutura do Agente V8
        shell: bash
        run: |
          set -e

          mkdir -p proj/app/src/main/java/com/tomo/agentev8

          mkdir -p proj/app/src/main/java/com/tomo/agentev8/core
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/data
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/voice
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/overlay
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/accessibility
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/automation
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/projects
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/tasks
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/settings
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/security
          mkdir -p proj/app/src/main/java/com/tomo/agentev8/ui

          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/drawable
          mkdir -p proj/app/src/main/res/xml
          mkdir -p proj/app/src/main/res/mipmap-hdpi
          mkdir -p proj/app/src/main/res/mipmap-mdpi
          mkdir -p proj/app/src/main/res/mipmap-xhdpi
          mkdir -p proj/app/src/main/res/mipmap-xxhdpi
          mkdir -p proj/app/src/main/res/mipmap-xxxhdpi

      # ============================================================
      # 3. SETTINGS.GRADLE
      # ============================================================

      - name: Criar settings.gradle
        shell: bash
        run: |
          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(
                  RepositoriesMode.FAIL_ON_PROJECT_REPOS
              )

              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "AgenteV8"

          include(":app")
          EOF

      # ============================================================
      # 4. BUILD PRINCIPAL
      # ============================================================

      - name: Criar build.gradle
        shell: bash
        run: |
          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

      # ============================================================
      # 5. GRADLE PROPERTIES
      # ============================================================

      - name: Criar gradle.properties
        shell: bash
        run: |
          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

          android.useAndroidX=true

          kotlin.code.style=official

          android.nonTransitiveRClass=true
          EOF

      # ============================================================
      # 6. APP BUILD
      # ============================================================

      - name: Criar app/build.gradle
        shell: bash
        run: |
          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {

              namespace 'com.tomo.agentev8'

              compileSdk 34

              defaultConfig {

                  applicationId 'com.tomo.agentev8'

                  minSdk 26

                  targetSdk 34

                  versionCode 1

                  versionName '1.0.0'

                  testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
              }

              buildTypes {

                  debug {
                      debuggable true
                  }

                  release {

                      minifyEnabled false

                      proguardFiles(
                          getDefaultProguardFile(
                              'proguard-android-optimize.txt'
                          ),
                          'proguard-rules.pro'
                      )
                  }
              }

              compileOptions {

                  sourceCompatibility JavaVersion.VERSION_17

                  targetCompatibility JavaVersion.VERSION_17
              }

              kotlinOptions {

                  jvmTarget = '17'
              }
          }

          dependencies {

              implementation(
                  'androidx.core:core-ktx:1.13.1'
              )

              implementation(
                  'androidx.appcompat:appcompat:1.7.0'
              )

              implementation(
                  'com.google.android.material:material:1.12.0'
              )

              implementation(
                  'androidx.lifecycle:lifecycle-runtime-ktx:2.8.3'
              )

              implementation(
                  'androidx.activity:activity-ktx:1.9.0'
              )

              implementation(
                  'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
              )

              implementation(
                  'com.squareup.okhttp3:okhttp:4.12.0'
              )
          }
          EOF

          touch proj/app/proguard-rules.pro

      # ============================================================
      # 7. MANIFEST
      # ============================================================

      - name: Criar AndroidManifest.xml
        shell: bash
        run: |
          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest
              xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- ================================================= -->
              <!-- PERMISSÕES -->
              <!-- ================================================= -->

              <uses-permission
                  android:name="android.permission.RECORD_AUDIO"/>

              <uses-permission
                  android:name="android.permission.SYSTEM_ALERT_WINDOW"/>

              <uses-permission
                  android:name="android.permission.POST_NOTIFICATIONS"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE"/>

              <uses-permission
                  android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>

              <uses-permission
                  android:name="android.permission.VIBRATE"/>

              <!-- ================================================= -->
              <!-- APPLICATION -->
              <!-- ================================================= -->

              <application

                  android:allowBackup="true"

                  android:label="Agente V8"

                  android:supportsRtl="true"

                  android:theme="@style/Theme.AgenteV8"

                  android:usesCleartextTraffic="false">

                  <!-- ============================================= -->
                  <!-- MAIN -->
                  <!-- ============================================= -->

                  <activity

                      android:name=".MainActivity"

                      android:exported="true">

                      <intent-filter>

                          <action
                              android:name="android.intent.action.MAIN"/>

                          <category
                              android:name="android.intent.category.LAUNCHER"/>

                      </intent-filter>

                  </activity>

                  <!-- ============================================= -->
                  <!-- BUBBLE -->
                  <!-- ============================================= -->

                  <service

                      android:name=".overlay.FloatingBubbleService"

                      android:exported="false"/>

                  <!-- ============================================= -->
                  <!-- VOICE -->
                  <!-- ============================================= -->

                  <service

                      android:name=".voice.V8VoiceService"

                      android:exported="false"

                      android:foregroundServiceType="microphone"/>

                  <!-- ============================================= -->
                  <!-- ACCESSIBILITY -->
                  <!-- ============================================= -->

                  <service

                      android:name=".accessibility.V8AccessibilityService"

                      android:exported="false"

                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">

                      <intent-filter>

                          <action
                              android:name="android.accessibilityservice.AccessibilityService"/>

                      </intent-filter>

                      <meta-data

                          android:name="android.accessibilityservice"

                          android:resource="@xml/accessibility_service_config"/>

                  </service>

              </application>

          </manifest>
          EOF

      # ============================================================
      # 8. CORES
      # ============================================================

      - name: Criar cores
        shell: bash
        run: |
          cat > proj/app/src/main/res/values/colors.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <color name="v8_background">
                  #080A10
              </color>

              <color name="v8_surface">
                  #111521
              </color>

              <color name="v8_surface_2">
                  #181D2A
              </color>

              <color name="v8_primary">
                  #6C63FF
              </color>

              <color name="v8_primary_dark">
                  #4038A8
              </color>

              <color name="v8_text">
                  #F5F7FF
              </color>

              <color name="v8_text_secondary">
                  #9BA4B5
              </color>

              <color name="v8_success">
                  #45D483
              </color>

              <color name="v8_warning">
                  #FFCC66
              </color>

              <color name="v8_error">
                  #FF6677
              </color>

          </resources>
          EOF

      # ============================================================
      # 9. STRINGS
      # ============================================================

      - name: Criar strings
        shell: bash
        run: |
          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <string name="app_name">
                  Agente V8
              </string>

              <string name="accessibility_description">
                  Permite ao Agente V8 observar elementos visíveis e executar ações de interface quando o usuário autorizar a acessibilidade.
              </string>

          </resources>
          EOF

      # ============================================================
      # 10. TEMA
      # ============================================================

      - name: Criar tema
        shell: bash
        run: |
          cat > proj/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <resources>

              <style
                  name="Theme.AgenteV8"
                  parent="android:style/Theme.Material.NoActionBar">

                  <item name="android:fontFamily">
                      sans
                  </item>

                  <item name="android:windowLightStatusBar">
                      false
                  </item>

                  <item name="android:statusBarColor">
                      @color/v8_background
                  </item>

                  <item name="android:navigationBarColor">
                      @color/v8_background
                  </item>

                  <item name="android:colorAccent">
                      @color/v8_primary
                  </item>

                  <item name="android:windowActionModeOverlay">
                      true
                  </item>

              </style>

          </resources>
          EOF

      # ============================================================
      # 11. BUBBLE
      # ============================================================

      - name: Criar Bubble V8
        shell: bash
        run: |
          cat > proj/app/src/main/res/drawable/v8_bubble.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <shape
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">

              <gradient

                  android:type="radial"

                  android:centerX="35%"

                  android:centerY="30%"

                  android:gradientRadius="70dp"

                  android:startColor="#B0AAFF"

                  android:centerColor="#6C63FF"

                  android:endColor="#29235F"/>

              <stroke

                  android:width="2dp"

                  android:color="#D7D4FF"/>

              <size

                  android:width="64dp"

                  android:height="64dp"/>

          </shape>
          EOF

          cat > proj/app/src/main/res/drawable/v8_bubble_pressed.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <selector
              xmlns:android="http://schemas.android.com/apk/res/android">

              <item android:state_pressed="true">

                  <shape android:shape="oval">

                      <solid android:color="#453DAE"/>

                      <stroke
                          android:width="2dp"
                          android:color="#FFFFFF"/>

                  </shape>

              </item>

              <item>

                  <shape android:shape="oval">

                      <solid android:color="#6C63FF"/>

                  </shape>

              </item>

          </selector>
          EOF

      # ============================================================
      # 12. ACCESSIBILITY CONFIG
      # ============================================================

      - name: Criar configuração de acessibilidade
        shell: bash
        run: |
          cat > proj/app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <accessibility-service

              xmlns:android="http://schemas.android.com/apk/res/android"

              android:accessibilityEventTypes="typeAllMask"

              android:accessibilityFeedbackType="feedbackGeneric"

              android:notificationTimeout="100"

              android:canRetrieveWindowContent="true"

              android:canPerformGestures="true"

              android:description="@string/accessibility_description"/>

          EOF

      # ============================================================
      # 13. MODELOS DO V8
      # ============================================================

      - name: Criar modelos
        shell: bash
        run: |
          cat > proj/app/src/main/java/com/tomo/agentev8/core/V8Models.kt <<'EOF'
          package com.tomo.agentev8.core

          data class V8Command(

              val raw: String,

              val type: CommandType,

              val target: String? = null,

              val value: String? = null
          )

          enum class CommandType {

              OPEN_APP,

              HOME,

              BACK,

              RECENTS,

              CLICK_TEXT,

              TYPE_TEXT,

              WAIT,

              UNKNOWN
          }

          data class V8Result(

              val success: Boolean,

              val message: String,

              val shouldSpeak: Boolean = true
          )
          EOF

      # ============================================================
      # 14. PARSER
      # ============================================================

      - name: Criar parser
        shell: bash
        run: |
          cat > proj/app/src/main/java/com/tomo/agentev8/core/ActionParser.kt <<'EOF'
          package com.tomo.agentev8.core

          class ActionParser {

              fun parse(input: String): V8Command {

                  val text = input.trim()

                  val lower = text.lowercase()

                  if (
                      lower == "voltar" ||
                      lower.contains("volta uma tela") ||
                      lower.contains("volte")
                  ) {
                      return V8Command(
                          text,
                          CommandType.BACK
                      )
                  }

                  if (
                      lower == "home" ||
                      lower.contains("tela inicial") ||
                      lower.contains("ir para o início")
                  ) {
                      return V8Command(
                          text,
                          CommandType.HOME
                      )
                  }

                  if (
                      lower.contains("aplicativos recentes") ||
                      lower.contains("apps recentes")
                  ) {
                      return V8Command(
                          text,
                          CommandType.RECENTS
                      )
                  }

                  if (lower.contains("roblox")) {

                      return V8Command(
                          text,
                          CommandType.OPEN_APP,
                          "com.roblox.client"
                      )
                  }

                  if (
                      lower.contains("youtube")
                  ) {

                      return V8Command(
                          text,
                          CommandType.OPEN_APP,
                          "com.google.android.youtube"
                      )
                  }

                  if (
                      lower.contains("whatsapp")
                  ) {

                      return V8Command(
                          text,
                          CommandType.OPEN_APP,
                          "com.whatsapp"
                      )
                  }

                  if (
                      lower.startsWith("clique em ")
                  ) {

                      return V8Command(
                          text,
                          CommandType.CLICK_TEXT,
                          target = text.substring(10).trim()
                      )
                  }

                  if (
                      lower.startsWith("clicar em ")
                  ) {

                      return V8Command(
                          text,
                          CommandType.CLICK_TEXT,
                          target = text.substring(10).trim()
                      )
                  }

                  if (
                      lower.startsWith("digite ")
                  ) {

                      return V8Command(
                          text,
                          CommandType.TYPE_TEXT,
                          value = text.substring(7).trim()
                      )
                  }

                  return V8Command(
                      text,
                      CommandType.UNKNOWN
                  )
              }
          }
          EOF

      # ============================================================
      # 15. MEMÓRIA
      # ============================================================

      - name: Criar memória
        shell: bash
        run: |
          cat > proj/app/src/main/java/com/tomo/agentev8/data/MemoryStore.kt <<'EOF'
          package com.tomo.agentev8.data

          import android.content.Context
          import org.json.JSONArray

          class MemoryStore(
              context: Context
          ) {

              private val preferences =
                  context.getSharedPreferences(
                      "v8_memory",
                      Context.MODE_PRIVATE
                  )

              fun add(
                  text: String
              ) {

                  val old = JSONArray(
                      preferences.getString(
                          "history",
                          "[]"
                      )
                  )

                  old.put(text)

                  val start =
                      (old.length() - 150)
                          .coerceAtLeast(0)

                  val result = JSONArray()

                  for (
                      index in start until old.length()
                  ) {

                      result.put(
                          old.getString(index)
                      )
                  }

                  preferences
                      .edit()
                      .putString(
                          "history",
                          result.toString()
                      )
                      .apply()
              }

              fun getAll(): List<String> {

                  val array =
                      JSONArray(
                          preferences.getString(
                              "history",
                              "[]"
                          )
                      )

                  return List(array.length()) {
                      index ->
                      array.getString(index)
                  }
              }

              fun clear() {

                  preferences
                      .edit()
                      .remove("history")
                      .apply()
              }
          }
          EOF

      # ============================================================
      # 16. FIM DA PARTE 1
      # ============================================================      # ============================================================
      # 17. ACCESSIBILITY SERVICE
      # ============================================================

      - name: Criar Accessibility Service
        shell: bash
        run: |
          cat > proj/app/src/main/java/com/tomo/agentev8/accessibility/V8AccessibilityService.kt <<'EOF'
          package com.tomo.agentev8.accessibility

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.graphics.Rect
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class V8AccessibilityService : AccessibilityService() {

              companion object {

                  @Volatile
                  var instance: V8AccessibilityService? = null
                      private set
              }

              override fun onServiceConnected() {

                  super.onServiceConnected()

                  instance = this
              }

              override fun onAccessibilityEvent(
                  event: AccessibilityEvent?
              ) {
                  // O V8 pode observar a interface aqui.
                  // Nenhuma ação automática é executada
                  // apenas por observar um evento.
              }

              override fun onInterrupt() {
              }

              override fun onDestroy() {

                  if (instance === this) {
                      instance = null
                  }

                  super.onDestroy()
              }

              fun goBack(): Boolean {

                  return performGlobalAction(
                      GLOBAL_ACTION_BACK
                  )
              }

              fun goHome(): Boolean {

                  return performGlobalAction(
                      GLOBAL_ACTION_HOME
                  )
              }

              fun openRecents(): Boolean {

                  return performGlobalAction(
                      GLOBAL_ACTION_RECENTS
                  )
              }

              fun clickText(
                  text: String
              ): Boolean {

                  val root =
                      rootInActiveWindow
                          ?: return false

                  val nodes =
                      root.findAccessibilityNodeInfosByText(
                          text
                      )

                  val exact =
                      nodes.firstOrNull {
                          it.isVisibleToUser &&
                          it.text?.toString()
                              ?.equals(
                                  text,
                                  ignoreCase = true
                              ) == true
                      }

                  val node =
                      exact
                          ?: nodes.firstOrNull {
                              it.isVisibleToUser &&
                              it.isClickable
                          }
                          ?: nodes.firstOrNull {
                              it.isVisibleToUser
                          }
                          ?: return false

                  return clickNode(node)
              }

              private fun clickNode(
                  original: AccessibilityNodeInfo
              ): Boolean {

                  var node:
                      AccessibilityNodeInfo? =
                      original

                  while (node != null) {

                      if (node.isClickable) {

                          return node.performAction(
                              AccessibilityNodeInfo.ACTION_CLICK
                          )
                      }

                      node = node.parent
                  }

                  val bounds = Rect()

                  original.getBoundsInScreen(
                      bounds
                  )

                  if (
                      bounds.width() <= 0 ||
                      bounds.height() <= 0
                  ) {
                      return false
                  }

                  return tap(
                      bounds.centerX().toFloat(),
                      bounds.centerY().toFloat()
                  )
              }

              fun tap(
                  x: Float,
                  y: Float
              ): Boolean {

                  val path =
                      Path().apply {
                          moveTo(x, y)
                      }

                  val stroke =
                      GestureDescription.StrokeDescription(
                          path,
                          0,
                          60
                      )

                  val gesture =
                      GestureDescription.Builder()
                          .addStroke(stroke)
                          .build()

                  return dispatchGesture(
                      gesture,
                      null,
                      null
                  )
              }

              fun findVisibleTexts(): List<String> {

                  val root =
                      rootInActiveWindow
                          ?: return emptyList()

                  val result =
                      mutableListOf<String>()

                  collectText(
                      root,
                      result
                  )

                  return result.distinct()
              }

              private fun collectText(
                  node: AccessibilityNodeInfo,
                  result: MutableList<String>
              ) {

                  node.text
                      ?.toString()
                      ?.trim()
                      ?.takeIf { it.isNotEmpty() }
                      ?.let {
                          result.add(it)
                      }

                  node.contentDescription
                      ?.toString()
                      ?.trim()
                      ?.takeIf { it.isNotEmpty() }
                      ?.let {
                          result.add(it)
                      }

                  for (
                      i in 0 until node.childCount
                  ) {

                      node.getChild(i)
                          ?.let {
                              collectText(
                                  it,
                                  result
                              )
                          }
                  }
              }
          }
          EOF

      # ============================================================
      # 18. ACTION EXECUTOR
      # ============================================================

      - name: Criar ActionExecutor
        shell: bash
        run: |
          cat > proj/app/src/main/java/com/tomo/agentev8/core/ActionExecutor.kt <<'EOF'
          package com.tomo.agentev8.core

          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.provider.Settings
          import com.tomo.agentev8.accessibility.V8AccessibilityService

          class ActionExecutor(
              private val context: Context
          ) {

              fun execute(
                  command: V8Command
              ): V8Result {

                  return when (
                      command.type
                  ) {

                      CommandType.OPEN_APP ->
                          openApp(
                              command.target
                          )

                      CommandType.BACK -> {

                          val service =
                              V8AccessibilityService.instance

                          if (
                              service?.goBack() == true
                          ) {

                              V8Result(
                                  true,
                                  "Voltando."
                              )

                          } else {

                              V8Result(
                                  false,
                                  "A acessibilidade do V8 não está ativa."
                              )
                          }
                      }

                      CommandType.HOME -> {

                          val service =
                              V8AccessibilityService.instance

                          if (
                              service?.goHome() == true
                          ) {

                              V8Result(
                                  true,
                                  "Indo para a tela inicial."
                              )

                          } else {

                              V8Result(
                                  false,
                                  "A acessibilidade do V8 não está ativa."
                              )
                          }
                      }

                      CommandType.RECENTS -> {

                          val service =
                              V8AccessibilityService.instance

                          if (
                              service?.openRecents() == true
                          ) {

                              V8Result(
                                  true,
                                  "Abrindo aplicativos recentes."
                              )

                          } else {

                              V8Result(
                                  false,
                                  "A acessibilidade do V8 não está ativa."
                              )
                          }
                      }

                      CommandType.CLICK_TEXT -> {

                          val service =
                              V8AccessibilityService.instance

                          val target =
                              command.target
                                  ?.trim()
                                  .orEmpty()

                          if (target.isEmpty()) {

                              V8Result(
                                  false,
                                  "Você precisa informar o botão."
                              )

                          } else if (
                              service?.clickText(
                                  target
                              ) == true
                          ) {

                              V8Result(
                                  true,
                                  "Clique realizado."
                              )

                          } else {

                              V8Result(
                                  false,
                                  "Não encontrei \"$target\" na tela."
                              )
                          }
                      }

                      CommandType.TYPE_TEXT -> {

                          V8Result(
                              false,
                              "Entrada de texto por Accessibility será ativada pelo executor de texto."
                          )
                      }

                      CommandType.WAIT -> {

                          V8Result(
                              true,
                              "Aguardando."
                          )
                      }

                      CommandType.UNKNOWN -> {

                          V8Result(
                              false,
                              "Ainda não entendi esse comando localmente."
                          )
                      }
                  }
              }

              private fun openApp(
                  packageName: String?
              ): V8Result {

                  if (
                      packageName.isNullOrBlank()
                  ) {

                      return V8Result(
                          false,
                          "Aplicativo não informado."
                      )
                  }

                  val manager =
                      context.packageManager

                  val intent =
                      manager.getLaunchIntentForPackage(
                          packageName
                      )

                  if (intent == null) {

                      return V8Result(
                          false,
                          "Esse aplicativo não está instalado."
                      )
                  }

                  intent.addFlags(
                      Intent.FLAG_ACTIVITY_NEW_TASK
                  )

                  return try {

                      context.startActivity(
                          intent
                      )

                      V8Result(
                          true,
                          "Abrindo aplicativo."
                      )

                  } catch (
                      exception: Exception
                  ) {

                      V8Result(
                          false,
                          "Não consegui abrir o aplicativo."
                      )
                  }
              }
          }
          EOF

      # ============================================================
      # 19. AGENT CORE
      # ============================================================

      - name: Criar AgentCore
        shell: bash
        run: |
          cat > proj/app/src/main/java/com/tomo/agentev8/core/AgentCore.kt <<'EOF'
          package com.tomo.agentev8.core

          import android.content.Context
          import com.tomo.agentev8.data.MemoryStore

          class AgentCore(
              context: Context
          ) {

              private val parser =
                  ActionParser()

              private val executor =
                  ActionExecutor(context)

              private val memory =
                  MemoryStore(context)

              fun process(
                  input: String
              ): V8Result {

                  val clean =
                      input.trim()

                  if (clean.isEmpty()) {

                      return V8Result(
                          false,
                          "Não recebi nenhum comando."
                      )
                  }

                  memory.add(
                      "VOCÊ: $clean"
                  )

                  val command =
                      parser.parse(clean)

                  val result =
                      executor.execute(
                          command
                      )

                  memory.add(
                      "V8: ${result.message}"
                  )

                  return result
              }

              fun history():
                  List<String> {

                  return memory.getAll()
              }

              fun clearHistory() {

                  memory.clear()
              }
          }
          EOF

