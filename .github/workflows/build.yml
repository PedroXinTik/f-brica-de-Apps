name: Build Agente V8
run-name: Compilando Agente V8 🚀

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: ☕ Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📁 CRIAR ESTRUTURA COMPLETA DO PROJETO
        shell: bash
        run: |
          mkdir -p proj/app/src/main/java/com/tomo/agentev8
          mkdir -p proj/app/src/main/res/layout
          mkdir -p proj/app/src/main/res/values
          mkdir -p proj/app/src/main/res/drawable
          mkdir -p proj/gradle/wrapper

          # ======================================
          # gradle-wrapper.properties
          # ======================================
          cat > proj/gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          networkTimeout=10000
          validateDistributionUrl=true
          EOF

          # ======================================
          # settings.gradle
          # ======================================
          cat > proj/settings.gradle << 'EOF'
          pluginManagement {
            repositories {
              google()
              mavenCentral()
              gradlePluginPortal()
            }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
              google()
              mavenCentral()
            }
          }
          rootProject.name = "AgenteV8"
          include(":app")
          EOF

          # ======================================
          # build.gradle (raiz)
          # ======================================
          cat > proj/build.gradle << 'EOF'
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath "com.android.tools.build:gradle:8.2.0"
              classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.20"
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          task clean(type: Delete) {
            delete rootProject.buildDir
          }
          EOF

          # ======================================
          # gradle.properties
          # ======================================
          cat > proj/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          # ======================================
          # app/build.gradle
          # ======================================
          cat > proj/app/build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "org.jetbrains.kotlin.android"
          }

          android {
            namespace "com.tomo.agentev8"
            compileSdk 34

            defaultConfig {
              applicationId "com.tomo.agentev8"
              minSdk 26
              targetSdk 34
              versionCode 1
              versionName "0.2.0"
            }

            buildTypes {
              debug {
                debuggable true
              }
              release {
                minifyEnabled false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
              jvmTarget = "17"
            }
          }

          dependencies {
              implementation "androidx.core:core-ktx:1.12.0"
              implementation "androidx.appcompat:appcompat:1.7.0"
              implementation "com.google.android.material:material:1.12.0"
              implementation "androidx.preference:preference-ktx:1.2.1"
          }
          EOF

          # ======================================
          # AndroidManifest.xml
          # ======================================
          cat > proj/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />

              <application
                  android:allowBackup="true"
                  android:label="Agente V8"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@style/Theme.AgenteV8">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false" />

              </application>
          </manifest>
          EOF

          # ======================================
          # MainActivity.kt
          # ======================================
          cat > proj/app/src/main/java/com/tomo/agentev8/MainActivity.kt << 'EOF'
          package com.tomo.agentev8

          import android.content.Intent
          import android.content.SharedPreferences
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var prefs: SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(48, 60, 48, 48)
                  layout.setBackgroundColor(0xFF1E1E1E.toInt())
                  scroll.addView(layout)

                  prefs = getSharedPreferences("AgenteV8", MODE_PRIVATE)

                  val title = TextView(this)
                  title.text = "AGENTE V8"
                  title.textSize = 28f
                  title.setTextColor(0xFFFFFFFF.toInt())
                  title.setPadding(0, 0, 0, 8)
                  layout.addView(title)

                  val versao = TextView(this)
                  versao.text = "versão 0.2.0 — Base Funcional"
                  versao.textSize = 12f
                  versao.setTextColor(0xFFB0B0B0.toInt())
                  versao.setPadding(0, 0, 0, 40)
                  layout.addView(versao)

                  val chaveStatus = TextView(this)
                  atualizarStatus(chaveStatus)
                  chaveStatus.textSize = 15f
                  chaveStatus.setPadding(0, 0, 0, 35)
                  layout.addView(chaveStatus)

                  val btnChat = Button(this)
                  btnChat.text = "💬 Conversar com o V8"
                  btnChat.setTextColor(0xFFFFFFFF.toInt())
                  btnChat.setBackgroundColor(0xFFFFC107.toInt())
                  btnChat.setPadding(0, 25, 0, 25)
                  val temChave = prefs.getString("API_KEY", "").isNullOrBlank().not()
                  btnChat.isEnabled = temChave
                  btnChat.alpha = if (temChave) 1f else 0.5f
                  btnChat.setOnClickListener {
                      if (!temChave) {
                          Toast.makeText(this, "⚠️ Configure sua chave API primeiro!", Toast.LENGTH_SHORT).show()
                      } else {
                          Toast.makeText(this, "🚧 Em desenvolvimento — Módulo de conversa", Toast.LENGTH_SHORT).show()
                      }
                  }
                  layout.addView(btnChat)

                  espaco(layout, 15)

                  val btnBolinha = Button(this)
                  btnBolinha.text = "🟡 Bolinha Flutuante"
                  btnBolinha.setTextColor(0xFF000000.toInt())
                  btnBolinha.setBackgroundColor(0xFFFFEB3B.toInt())
                  btnBolinha.isEnabled = false
                  btnBolinha.alpha = 0.4f
                  btnBolinha.setOnClickListener {
                      Toast.makeText(this, "🚧 Em breve", Toast.LENGTH_SHORT).show()
                  }
                  layout.addView(btnBolinha)

                  espaco(layout, 15)

                  val btnVoz = Button(this)
                  btnVoz.text = "🎤 Comandos de Voz"
                  btnVoz.setTextColor(0xFFFFFFFF.toInt())
                  btnVoz.setBackgroundColor(0xFF607D8B.toInt())
                  btnVoz.isEnabled = false
                  btnVoz.alpha = 0.4f
                  layout.addView(btnVoz)

                  espaco(layout, 25)

                  val btnConfig = Button(this)
                  btnConfig.text = "⚙️ Configuração da Chave API"
                  btnConfig.setTextColor(0xFFFFFFFF.toInt())
                  btnConfig.setBackgroundColor(0xFF2196F3.toInt())
                  btnConfig.setOnClickListener {
                      startActivity(Intent(this, SettingsActivity::class.java))
                  }
                  layout.addView(btnConfig)

                  espaco(layout, 15)

                  val btnSobre = Button(this)
                  btnSobre.text = "ℹ️ Sobre o Agente V8"
                  btnSobre.setTextColor(0xFFFFFFFF.toInt())
                  btnSobre.setBackgroundColor(0xFF424242.toInt())
                  btnSobre.setOnClickListener {
                      Toast.makeText(this, "Assistente V8 — Projeto modular em desenvolvimento", Toast.LENGTH_LONG).show()
                  }
                  layout.addView(btnSobre)

                  setContentView(scroll)
              }

              private fun espaco(layout: LinearLayout, altura: Int) {
                  val v = TextView(this)
                  v.setPadding(0, altura, 0, altura)
                  layout.addView(v)
              }

              override fun onResume() {
                  super.onResume()
                  recreate()
              }

              private fun atualizarStatus(tv: TextView) {
                  val chave = prefs.getString("API_KEY", "")
                  if (chave.isNullOrBlank()) {
                      tv.text = "⚠️ Nenhuma chave API configurada"
                      tv.setTextColor(0xFFFF9800.toInt())
                  } else {
                      val mascarada = if (chave.length > 8) "${chave.take(4)}••••${chave.takeLast(4)}" else "configurada"
                      tv.text = "✅ Chave API: $mascarada"
                      tv.setTextColor(0xFF4CAF50.toInt())
                  }
              }
          }
          EOF

          # ======================================
          # SettingsActivity.kt
          # ======================================
          cat > proj/app/src/main/java/com/tomo/agentev8/SettingsActivity.kt << 'EOF'
          package com.tomo.agentev8

          import android.content.SharedPreferences
          import android.os.Bundle
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class SettingsActivity : AppCompatActivity() {
              private lateinit var prefs: SharedPreferences

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val scroll = ScrollView(this)
                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(40, 50, 40, 50)
                  layout.setBackgroundColor(0xFF1E1E1E.toInt())
                  scroll.addView(layout)

                  prefs = getSharedPreferences("AgenteV8", MODE_PRIVATE)

                  val titulo = TextView(this)
                  titulo.text = "🔑 Chave API"
                  titulo.textSize = 22f
                  titulo.setTextColor(0xFFFFFFFF.toInt())
                  titulo.setPadding(0, 0, 0, 30)
                  layout.addView(titulo)

                  val aviso = TextView(this)
                  aviso.text = "⚠️ Sua chave fica salva SOMENTE neste celular.\nNunca envie para ninguém nem publique na internet!"
                  aviso.textSize = 14f
                  aviso.setTextColor(0xFFFF9800.toInt())
                  aviso.setPadding(0, 0, 0, 25)
                  layout.addView(aviso)

                  val label = TextView(this)
                  label.text = "Cole sua chave abaixo:"
                  label.textSize = 15f
                  label.setTextColor(0xFFFFFFFF.toInt())
                  label.setPadding(0, 0, 0, 10)
                  layout.addView(label)

                  val input = EditText(this)
                  input.hint = "Insira sua chave API aqui..."
                  input.setTextColor(0xFFFFFFFF.toInt())
                  input.setHintTextColor(0xFF888888.toInt())
                  input.setBackgroundColor(0xFF2C2C2C.toInt())
                  input.setPadding(16, 16, 16, 16)
                  input.setTextColor(0xFFFFFFFF.toInt())
                  input.setText(prefs.getString("API_KEY", ""))
                  layout.addView(input)

                  espaco(layout, 25)

                  val btnSalvar = Button(this)
                  btnSalvar.text = "✅ Salvar Chave"
                  btnSalvar.setBackgroundColor(0xFF4CAF50.toInt())
                  btnSalvar.setTextColor(0xFFFFFFFF.toInt())
                  btnSalvar.setOnClickListener {
                      val chave = input.text.toString().trim()
                      prefs.edit().putString("API_KEY", chave).apply()
                      if (chave.isNotEmpty()) {
                          Toast.makeText(this, "✅ Chave salva com sucesso!", Toast.LENGTH_SHORT).show()
                          finish()
                      } else {
                          Toast.makeText(this, "🗑️ Chave removida!", Toast.LENGTH_SHORT).show()
                          finish()
                      }
                  }
                  layout.addView(
