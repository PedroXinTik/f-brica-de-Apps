          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import java.util.Locale
          class MainActivity : Activity() {
              private lateinit var core: AgentCore
              private lateinit var prefs: android.content.SharedPreferences
              private lateinit var content: FrameLayout
              private lateinit var chatContainer: LinearLayout
              private lateinit var chatScroll: ScrollView
              private lateinit var input: EditText
              private lateinit var memoryContainer: LinearLayout
              private lateinit var projectContainer: LinearLayout
              private lateinit var taskContainer: LinearLayout
              private lateinit var evolutionContainer: LinearLayout
              private lateinit var settingsContainer: LinearLayout
              private val views = mutableListOf<View>()
              private val voiceCode = 501
              private val recordCode = 502
              override fun onCreate(state: Bundle?) {
                  super.onCreate(state)
                  core = AgentCore(this)
                  prefs = getSharedPreferences("v8_config", Context.MODE_PRIVATE)
                  buildUi()
                  restoreHistory()
