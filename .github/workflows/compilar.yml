name: Compilar e Publicar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Criar projeto Android com Tela de Configuração Gemini
        shell: bash
        run: |
          mkdir -p proj/app/src/main/java/com/tomo/agentev8 proj/app/src/main/res/values

          cat > proj/settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AgenteV8"
          include ":app"
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tomo.agentev8'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tomo.agentev8'
                  minSdk 26
                  targetSdk 34
                  versionCode 2
                  versionName '1.1'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application android:label="Agente V8" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Agente V8</string></resources>
          EOF

          cat > proj/app/src/main/java/com/tomo/agentev8/MainActivity.kt <<'EOF'
          package com.tomo.agentev8

          import android.app.Activity
          import android.content.Context
          import android.graphics.Color
          import android.os.Bundle
          import android.text.InputType
          import android.view.Gravity
          import android.widget.*

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("v8_config", Context.MODE_PRIVATE)

                  val rootLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(40, 60, 40, 40)
                  }

                  val titleText = TextView(this).apply {
                      text = "⚙️ Configurações Agente V8"
                      textSize = 22f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 40)
                  }
                  rootLayout.addView(titleText)

                  val keyLabel = TextView(this).apply {
                      text = "Chave API do Gemini:"
                      textSize = 16f
                      setTextColor(Color.parseColor("#94A3B8"))
                  }
                  rootLayout.addView(keyLabel)

                  val apiKeyInput = EditText(this).apply {
                      hint = "Cole sua API Key aqui..."
                      setHintTextColor(Color.parseColor("#64748B"))
                      setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setPadding(30, 30, 30, 30)
                      setText(prefs.getString("api_key", ""))
                  }
                  rootLayout.addView(apiKeyInput)

                  val modelLabel = TextView(this).apply {
                      text = "\nSelecione o Modelo:"
                      textSize = 16f
                      setTextColor(Color.parseColor("#94A3B8"))
                  }
                  rootLayout.addView(modelLabel)

                  val models = arrayOf("gemini-1.5-flash", "gemini-1.5-pro", "gemini-1.0-pro")
                  val spinner = Spinner(this).apply {
                      setBackgroundColor(Color.parseColor("#1E293B"))
                  }

                  val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, models)
                  spinner.adapter = adapter

                  val savedModel = prefs.getString("selected_model", "gemini-1.5-flash")
                  val savedIndex = models.indexOf(savedModel)
                  if (savedIndex >= 0) spinner.setSelection(savedIndex)

                  rootLayout.addView(spinner)

                  val saveButton = Button(this).apply {
                      text = "SALVAR CONFIGURAÇÕES"
                      setBackgroundColor(Color.parseColor("#2563EB"))
                      setTextColor(Color.WHITE)
                      setPadding(0, 30, 0, 30)
                  }

                  val layoutParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply {
                      topMargin = 50
                  }

                  saveButton.layoutParams = layoutParams

                  saveButton.setOnClickListener {
                      val key = apiKeyInput.text.toString().trim()
                      val selectedModel = spinner.selectedItem.toString()

                      if (key.isEmpty()) {
                          Toast.makeText(this@MainActivity, "Por favor, insira uma API Key válida!", Toast.LENGTH_SHORT).show()
                      } else {
                          prefs.edit()
                              .putString("api_key", key)
                              .putString("selected_model", selectedModel)
                              .apply()

                          Toast.makeText(this@MainActivity, "Configurações salvas para $selectedModel!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  rootLayout.addView(saveButton)
                  setContentView(rootLayout)
              }
          }
          EOF

      - name: Gerar Gradle Wrapper e Compilar APK
        shell: bash
        run: |
          cd proj
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1-${{ github.run_number }}
          name: "Agente V8 - Configurações Gemini (Versão ${{ github.run_number }})"
          body: "APK atualizado com tela de inserção da chave API e seleção de modelos do Gemini."
          files: proj/app/build/outputs/apk/debug/app-debug.apk
