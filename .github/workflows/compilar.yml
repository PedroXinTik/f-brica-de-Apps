          package com.tomo.agentev8
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.os.Build
          import android.os.IBinder
          class BackgroundTaskService : Service() {
              companion object {
                  private const val CHANNEL_ID = "v8_background"
                  private const val NOTIFICATION_ID = 808
              }
              override fun onCreate() {
                  super.onCreate()
                  createChannel()
                  startForeground(NOTIFICATION_ID, notification("Agente V8 executando tarefa"))
              }
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val title = intent?.getStringExtra("task_title") ?: "Tarefa V8"
                  Thread {
                      try {
                          Thread.sleep(1200)
                      } finally {
                          val db = DatabaseHelper(applicationContext)
                          db.addTask(title, "Concluído", "Processamento finalizado pelo serviço")
                          stopSelf(startId)
                      }
                  }.start()
                  return START_NOT_STICKY
              }
              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val manager = getSystemService(NotificationManager::class.java)
                      manager.createNotificationChannel(
                          NotificationChannel(
                              CHANNEL_ID,
                              "Agente V8",
                              NotificationManager.IMPORTANCE_LOW
                          )
                      )
                  }
              }
              private fun notification(text: String): Notification {
                  val intent = Intent(this, MainActivity::class.java)
                  val pending = PendingIntent.getActivity(
                      this,
                      0,
                      intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      Notification.Builder(this, CHANNEL_ID)
                          .setContentTitle("Agente V8")
                          .setContentText(text)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentIntent(pending)
                          .setOngoing(true)
                          .build()
                  } else {
                      Notification.Builder(this)
                          .setContentTitle("Agente V8")
                          .setContentText(text)
                          .setSmallIcon(android.R.drawable.ic_dialog_info)
                          .setContentIntent(pending)
                          .build()
                  }
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF
