          package com.tomo.agentev8
          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper
          class DatabaseHelper(context: Context) :
              SQLiteOpenHelper(context, "agentev8.db", null, 3) {
              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL(
                      "CREATE TABLE memory (" +
                      "id INTEGER PRIMARY KEY AUTOINCREMENT," +
                      "info TEXT NOT NULL," +
                      "created_at INTEGER NOT NULL)"
                  )
                  db.execSQL(
                      "CREATE TABLE projects (" +
                      "id INTEGER PRIMARY KEY AUTOINCREMENT," +
                      "name TEXT NOT NULL," +
                      "description TEXT," +
                      "created_at INTEGER NOT NULL)"
                  )
                  db.execSQL(
                      "CREATE TABLE tasks (" +
                      "id INTEGER PRIMARY KEY AUTOINCREMENT," +
                      "title TEXT NOT NULL," +
                      "status TEXT NOT NULL," +
                      "result TEXT," +
                      "created_at INTEGER NOT NULL)"
                  )
                  db.execSQL(
                      "CREATE TABLE messages (" +
                      "id INTEGER PRIMARY KEY AUTOINCREMENT," +
                      "role TEXT NOT NULL," +
                      "text TEXT NOT NULL," +
                      "created_at INTEGER NOT NULL)"
                  )
                  db.execSQL(
                      "CREATE TABLE evolution (" +
                      "id INTEGER PRIMARY KEY AUTOINCREMENT," +
                      "goal TEXT NOT NULL," +
                      "score REAL NOT NULL," +
                      "generation INTEGER NOT NULL," +
                      "created_at INTEGER NOT NULL)"
                  )
              }
              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  if (oldVersion < 2) {
                      db.execSQL("CREATE TABLE IF NOT EXISTS messages (id INTEGER PRIMARY KEY AUTOINCREMENT, role TEXT NOT NULL, text TEXT NOT NULL, created_at INTEGER NOT NULL)")
                  }
                  if (oldVersion < 3) {
                      db.execSQL("CREATE TABLE IF NOT EXISTS evolution (id INTEGER PRIMARY KEY AUTOINCREMENT, goal TEXT NOT NULL, score REAL NOT NULL, generation INTEGER NOT NULL, created_at INTEGER NOT NULL)")
                  }
              }
              fun addMemory(info: String) {
                  if (info.isBlank()) return
                  writableDatabase.use { db ->
                      db.insert("memory", null, ContentValues().apply {
                          put("info", info)
                          put("created_at", System.currentTimeMillis())
                      })
                  }
              }
              fun getMemories(): List<String> {
                  val out = mutableListOf<String>()
                  readableDatabase.rawQuery(
                      "SELECT info FROM memory ORDER BY id DESC",
                      null
                  ).use { c ->
                      while (c.moveToNext()) out.add(c.getString(0))
                  }
                  return out
              }
              fun addProject(name: String, description: String) {
                  if (name.isBlank()) return
                  writableDatabase.use { db ->
                      db.insert("projects", null, ContentValues().apply {
                          put("name", name)
                          put("description", description)
                          put("created_at", System.currentTimeMillis())
                      })
                  }
              }
              fun getProjects(): List<String> {
                  val out = mutableListOf<String>()
                  readableDatabase.rawQuery(
                      "SELECT name, description FROM projects ORDER BY id DESC",
                      null
                  ).use { c ->
                      while (c.moveToNext()) {
                          out.add("${c.getString(0)} — ${c.getString(1) ?: ""}")
                      }
                  }
                  return out
              }
              fun addTask(title: String, status: String, result: String) {
                  writableDatabase.use { db ->
                      db.insert("tasks", null, ContentValues().apply {
                          put("title", title)
                          put("status", status)
                          put("result", result)
                          put("created_at", System.currentTimeMillis())
                      })
                  }
              }
              fun getTasks(): List<String> {
                  val out = mutableListOf<String>()
                  readableDatabase.rawQuery(
                      "SELECT title, status, result FROM tasks ORDER BY id DESC",
                      null
                  ).use { c ->
                      while (c.moveToNext()) {
                          out.add("[${c.getString(1)}] ${c.getString(0)} — ${c.getString(2) ?: ""}")
                      }
                  }
                  return out
              }
              fun addMessage(role: String, text: String) {
                  writableDatabase.use { db ->
                      db.insert("messages", null, ContentValues().apply {
                          put("role", role)
                          put("text", text)
                          put("created_at", System.currentTimeMillis())
                      })
                  }
              }
              fun getMessages(limit: Int = 30): List<Pair<String, String>> {
                  val out = mutableListOf<Pair<String, String>>()
                  readableDatabase.rawQuery(
                      "SELECT role, text FROM messages ORDER BY id DESC LIMIT $limit",
                      null
                  ).use { c ->
                      while (c.moveToNext()) out.add(c.getString(0) to c.getString(1))
                  }
                  return out.reversed()
              }
              fun addEvolution(goal: String, score: Double, generation: Int) {
                  writableDatabase.use { db ->
                      db.insert("evolution", null, ContentValues().apply {
                          put("goal", goal)
                          put("score", score)
                          put("generation", generation)
                          put("created_at", System.currentTimeMillis())
                      })
                  }
              }
              fun getEvolution(): List<String> {
                  val out = mutableListOf<String>()
                  readableDatabase.rawQuery(
                      "SELECT goal, score, generation FROM evolution ORDER BY id DESC LIMIT 30",
                      null
                  ).use { c ->
                      while (c.moveToNext()) {
                          out.add("${c.getString(0)} | score=${c.getDouble(1)} | gen=${c.getInt(2)}")
                      }
                  }
                  return out
              }
          }
          EOF
