                          { generation, score ->
                              line(evolutionContainer, "Gen $generation → ${"%.3f".format(Locale.US, score)}")
                          },
                          { best ->
                              Toast.makeText(
                                  this,
                                  "Evolução concluída: ${"%.3f".format(Locale.US, best)}",
                                  Toast.LENGTH_SHORT
                              ).show()
                          }
                      )
                  })
                  evolutionContainer.addView(action("Parar") {
                      core.evolution.stop()
                  })
                  core.evolution.history().forEach { line(evolutionContainer, it) }
              }
              private fun createSettings() {
                  val scroll = ScrollView(this)
                  settingsContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }
                  scroll.addView(settingsContainer)
                  addPage("settings", scroll)
              }
              private fun buildSettings() {
                  settingsContainer.removeAllViews()
                  title(settingsContainer, "🛠 Configurações")
                  val key = EditText(this).apply {
                      hint = "Gemini API Key"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(prefs.getString("api_key", "").orEmpty())
                  }
                  val model = EditText(this).apply {
                      hint = "Modelo"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      setText(prefs.getString("model", "gemini-2.5-flash"))
                  }
                  settingsContainer.addView(key)
                  settingsContainer.addView(model)
                  settingsContainer.addView(action("Salvar") {
                      prefs.edit()
                          .putString("api_key", key.text.toString().trim())
                          .putString("model", model.text.toString().trim())
                          .apply()
                      Toast.makeText(this, "Configurações salvas.", Toast.LENGTH_SHORT).show()
                  })
                  settingsContainer.addView(action("Testar Bubble") {
                      if (Settings.canDrawOverlays(this)) {
                          startService(Intent(this, FloatingBubbleService::class.java))
                      } else {
                          startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:$packageName")
                              )
                          )
                      }
                  })
                  settingsContainer.addView(action("Solicitar microfone") {
                      if (android.os.Build.VERSION.SDK_INT >= 23) {
                          requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), recordCode)
                      }
                  })
              }
              private fun voiceInput() {
                  val intent = Intent(android.speech.RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(
                          android.speech.RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          android.speech.RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                      )
                      putExtra(
                          android.speech.RecognizerIntent.EXTRA_LANGUAGE,
                          "pt-BR"
                      )
                  }
                  try {
                      startActivityForResult(intent, voiceCode)
                  } catch (_: Exception) {
                      Toast.makeText(this, "Reconhecimento de voz indisponível.", Toast.LENGTH_SHORT).show()
                  }
              }
              override fun onActivityResult(code: Int, result: Int, data: Intent?) {
                  super.onActivityResult(code, result, data)
                  if (code == voiceCode && result == RESULT_OK) {
                      val values = data?.getStringArrayListExtra(
                          android.speech.RecognizerIntent.EXTRA_RESULTS
                      )
                      val spoken = values?.firstOrNull()
                      if (!spoken.isNullOrBlank()) {
                          input.setText(spoken)
                          sendMessage()
                      }
                  }
              }
              private fun show(name: String) {
                  views.forEach { it.visibility = View.GONE }
                  val target = views.firstOrNull { it.tag == name }
                  target?.visibility = View.VISIBLE
                  if (name == "settings") buildSettings()
              }
              private fun addPage(name: String, view: View) {
                  view.tag = name
                  view.visibility = View.GONE
                  views.add(view)
                  content.addView(view, FrameLayout.LayoutParams(-1, -1))
              }
              private fun title(parent: LinearLayout, text: String) {
                  parent.addView(TextView(this).apply {
                      this.text = text
                      textSize = 20f
                      setTextColor(Color.WHITE)
                      setPadding(0, 0, 0, 25)
                  })
              }
              private fun line(parent: LinearLayout, text: String) {
                  parent.addView(TextView(this).apply {
                      this.text = text
                      textSize = 14f
                      setTextColor(Color.LTGRAY)
                      setPadding(0, 12, 0, 12)
                  })
              }
              private fun action(text: String, run: () -> Unit): Button {
                  return Button(this).apply {
                      this.text = text
                      setTextColor(Color.WHITE)
                      background = rounded("#2563EB", "#60A5FA", 18)
                      setOnClickListener { run() }
                  }
              }
              private fun rounded(bg: String, stroke: String, radius: Int): GradientDrawable {
                  return GradientDrawable().apply {
                      setColor(Color.parseColor(bg))
                      setStroke(2, Color.parseColor(stroke))
                      cornerRadius = radius.toFloat()
                  }
              }
              override fun onDestroy() {
                  core.shutdown()
                  super.onDestroy()
              }
          }
