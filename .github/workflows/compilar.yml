          package com.tomo.agentev8
          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          class AudioRecordManager(private val context: Context) {
              private var recorder: AudioRecord? = null
              @Volatile private var recording = false
              private var worker: Thread? = null
              fun hasPermission(): Boolean =
                  context.checkSelfPermission(Manifest.permission.RECORD_AUDIO) ==
                      PackageManager.PERMISSION_GRANTED
              fun start(onLevel: (Double) -> Unit = {}) {
                  if (!hasPermission() || recording) return
                  val sampleRate = 16000
                  val min = AudioRecord.getMinBufferSize(
                      sampleRate,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT
                  )
                  if (min <= 0) return
                  recorder = AudioRecord(
                      MediaRecorder.AudioSource.MIC,
                      sampleRate,
                      AudioFormat.CHANNEL_IN_MONO,
                      AudioFormat.ENCODING_PCM_16BIT,
                      min * 2
                  )
                  recording = true
                  recorder?.startRecording()
                  worker = Thread {
                      val buffer = ShortArray(min.coerceAtLeast(1024))
                      while (recording) {
                          val count = try {
                              recorder?.read(buffer, 0, buffer.size) ?: 0
                          } catch (_: Exception) {
                              0
                          }
                          if (count > 0) {
                              var sum = 0.0
                              for (i in 0 until count) {
                                  val value = buffer[i].toDouble()
                                  sum += value * value
                              }
                              val rms = kotlin.math.sqrt(sum / count) / 32768.0
                              onLevel(rms.coerceIn(0.0, 1.0))
                          }
                      }
                  }.also { it.start() }
              }
              fun stop() {
                  recording = false
                  try { recorder?.stop() } catch (_: Exception) {}
                  try { worker?.join(500) } catch (_: Exception) {}
                  worker = null
                  recorder?.release()
                  recorder = null
              }
          }
