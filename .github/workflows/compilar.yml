                      checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED
                  ) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), recordCode)
                  }
              }
              private fun buildUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.rgb(9, 13, 22))
                  }
                  val header = TextView(this).apply {
                      text = "⚡ AGENTE V8  •  CORE 5.0"
                      textSize = 17f
                      gravity = Gravity.CENTER
                      setTextColor(Color.rgb(56, 189, 248))
                      setPadding(12, 24, 12, 24)
                      setBackgroundColor(Color.rgb(19, 27, 46))
                  }
                  root.addView(header)
                  content = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(-1, 0, 1f)
                  }
                  root.addView(content)
                  val nav = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(4, 4, 4, 4)
                      setBackgroundColor(Color.rgb(19, 27, 46))
                  }
                  listOf(
                      "💬" to { show("chat") },
                      "🧠" to { loadMemory(); show("memory") },
                      "📂" to { loadProjects(); show("projects") },
                      "⚙" to { loadTasks(); show("tasks") },
                      "🧬" to { loadEvolution(); show("evolution") },
                      "🛠" to { show("settings") }
                  ).forEach { item ->
                      nav.addView(Button(this).apply {
                          text = item.first
                          setTextColor(Color.WHITE)
                          textSize = 13f
                          background = rounded("#1E293B", "#334155", 18)
                          layoutParams = LinearLayout.LayoutParams(0, 70, 1f)
                          setOnClickListener { item.second() }
                      })
                  }
                  root.addView(nav)
                  createChat()
                  createMemory()
                  createProjects()
                  createTasks()
                  createEvolution()
                  createSettings()
                  setContentView(root)
                  show("chat")
              }
              private fun createChat() {
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  chatScroll = ScrollView(this)
                  chatContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                  }
                  chatScroll.addView(chatContainer)
                  layout.addView(chatScroll, LinearLayout.LayoutParams(-1, 0, 1f))
                  val bar = LinearLayout(this).apply {
                      setPadding(8, 8, 8, 8)
                      setBackgroundColor(Color.rgb(19, 27, 46))
                  }
                  input = EditText(this).apply {
                      hint = "Fale com o V8..."
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_FLAG_MULTI_LINE
                      background = rounded("#1E293B", "#334155", 25)
                      setPadding(20, 12, 20, 12)
                  }
                  val send = Button(this).apply {
                      text = "➤"
                      setTextColor(Color.WHITE)
                      background = rounded("#2563EB", "#60A5FA", 25)
                      layoutParams = LinearLayout.LayoutParams(90, 90).apply {
                          leftMargin = 6
                      }
                      setOnClickListener { sendMessage() }
                  }
                  val voice = Button(this).apply {
                      text = "🎙"
                      setTextColor(Color.WHITE)
                      background = rounded("#0284C7", "#38BDF8", 25)
                      layoutParams = LinearLayout.LayoutParams(90, 90).apply {
                          leftMargin = 6
                      }
                      setOnClickListener { voiceInput() }
                  }
                  bar.addView(input, LinearLayout.LayoutParams(0, -2, 1f))
                  bar.addView(voice)
                  bar.addView(send)
                  layout.addView(bar)
                  addPage("chat", layout)
              }
              private fun sendMessage() {
                  val text = input.text.toString().trim()
                  if (text.isEmpty()) return
                  val key = prefs.getString("api_key", "").orEmpty()
                  if (key.isBlank()) {
                      Toast.makeText(this, "Configure a API Key primeiro.", Toast.LENGTH_LONG).show()
                      show("settings")
                      return
                  }
                  input.setText("")
                  addChat(text, true)
                  DatabaseHelper(this).addMessage("user", text)
                  val model = prefs.getString("model", "gemini-2.5-flash")
                      ?: "gemini-2.5-flash"
                  core.tasks.queue(text)
                  core.ai.askGemini(
                      apiKey = key,
                      model = model,
                      prompt = text,
                      memoryContext = core.memory.buildContext(),
                      history = DatabaseHelper(this).getMessages(20)
                  ) { reply, error ->
                      runOnUiThread {
                          if (reply != null) {
                              addChat(reply, false)
                              DatabaseHelper(this).addMessage("model", reply)
                              core.memory.saveIfUseful(text)
                          } else {
                              addChat("Erro: ${error ?: "desconhecido"}", false)
                          }
                      }
                  }
              }
              private fun addChat(text: String, user: Boolean) {
                  val tv = TextView(this).apply {
                      this.text = text
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      setPadding(20, 16, 20, 16)
                      background = rounded(
                          if (user) "#2563EB" else "#1E293B",
                          if (user) "#3B82F6" else "#334155",
                          22
                      )
                  }
                  chatContainer.addView(tv, LinearLayout.LayoutParams(-2, -2).apply {
                      gravity = if (user) Gravity.END else Gravity.START
                      topMargin = 10
                  })
                  chatScroll.post { chatScroll.fullScroll(View.FOCUS_DOWN) }
              }
              private fun restoreHistory() {
                  DatabaseHelper(this).getMessages(20).forEach {
                      addChat(it.second, it.first == "user")
                  }
              }
              private fun createMemory() {
                  val scroll = ScrollView(this)
                  memoryContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }
                  scroll.addView(memoryContainer)
                  addPage("memory", scroll)
              }
              private fun loadMemory() {
                  memoryContainer.removeAllViews()
                  title(memoryContainer, "🧠 Memória Persistente")
                  val input = EditText(this).apply {
                      hint = "Guardar uma memória..."
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                  }
                  memoryContainer.addView(input)
                  memoryContainer.addView(action("Salvar") {
                      core.memory.save(input.text.toString())
                      input.setText("")
                      loadMemory()
                  })
                  core.memory.all().forEach {
                      line(memoryContainer, "• $it")
                  }
              }
              private fun createProjects() {
                  val scroll = ScrollView(this)
                  projectContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }
                  scroll.addView(projectContainer)
                  addPage("projects", scroll)
              }
              private fun loadProjects() {
                  projectContainer.removeAllViews()
                  title(projectContainer, "📂 Projetos")
                  val name = EditText(this).apply {
                      hint = "Nome"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                  }
                  val desc = EditText(this).apply {
                      hint = "Descrição"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                  }
                  projectContainer.addView(name)
                  projectContainer.addView(desc)
                  projectContainer.addView(action("Criar projeto") {
                      core.projects.create(name.text.toString(), desc.text.toString())
                      loadProjects()
                  })
                  core.projects.all().forEach { line(projectContainer, "📌 $it") }
              }
              private fun createTasks() {
                  val scroll = ScrollView(this)
                  taskContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }
                  scroll.addView(taskContainer)
                  addPage("tasks", scroll)
              }
              private fun loadTasks() {
                  taskContainer.removeAllViews()
                  title(taskContainer, "⚙ Tarefas")
                  taskContainer.addView(action("Executar tarefa de teste") {
                      core.tasks.start("Tarefa V8 em background")
                      loadTasks()
                  })
                  core.tasks.all().forEach { line(taskContainer, "⚡ $it") }
              }
              private fun createEvolution() {
                  val scroll = ScrollView(this)
                  evolutionContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }
                  scroll.addView(evolutionContainer)
                  addPage("evolution", scroll)
              }
              private fun loadEvolution() {
                  evolutionContainer.removeAllViews()
                  title(evolutionContainer, "🧬 Evolution Lab")
                  val goal = EditText(this).apply {
                      hint = "Objetivo da evolução"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                  }
                  evolutionContainer.addView(goal)
                  evolutionContainer.addView(action("Iniciar evolução") {
                      core.evolution.train(
                          goal.text.toString().ifBlank { "Melhorar Agente V8" },
