name: Compilar e Publicar Agente V8 com Background Tasks

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Criar Projeto Agente V8 com Motor de Background
        shell: bash
        run: |
          mkdir -p proj/app/src/main/java/com/tomo/agentev8 proj/app/src/main/res/values

          cat > proj/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AgenteV8"
          include ":app"
          EOF

          cat > proj/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat > proj/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF

          cat > proj/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.tomo.agentev8'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.tomo.agentev8'
                  minSdk 26
                  targetSdk 34
                  versionCode 8
                  versionName '4.5'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          cat > proj/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              
              <application 
                  android:label="Agente V8" 
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > proj/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Agente V8</string></resources>
          EOF

          # Banco de Dados Local Completo (Memória, Projetos e Tarefas em Background)
          cat > proj/app/src/main/java/com/tomo/agentev8/DatabaseHelper.kt <<'EOF'
          package com.tomo.agentev8

          import android.content.ContentValues
          import android.content.Context
          import android.database.sqlite.SQLiteDatabase
          import android.database.sqlite.SQLiteOpenHelper

          class DatabaseHelper(context: Context) : SQLiteOpenHelper(context, "agentev8_full.db", null, 2) {

              override fun onCreate(db: SQLiteDatabase) {
                  db.execSQL("CREATE TABLE memory (id INTEGER PRIMARY KEY AUTOINCREMENT, info TEXT)")
                  db.execSQL("CREATE TABLE projects (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT, description TEXT)")
                  db.execSQL("CREATE TABLE background_tasks (id INTEGER PRIMARY KEY AUTOINCREMENT, title TEXT, status TEXT, result TEXT)")
              }

              override fun onUpgrade(db: SQLiteDatabase, oldVersion: Int, newVersion: Int) {
                  db.execSQL("DROP TABLE IF EXISTS memory")
                  db.execSQL("DROP TABLE IF EXISTS projects")
                  db.execSQL("DROP TABLE IF EXISTS background_tasks")
                  onCreate(db)
              }

              fun addMemory(info: String) {
                  writableDatabase.use { db ->
                      val values = ContentValues().apply { put("info", info) }
                      db.insert("memory", null, values)
                  }
              }

              fun getMemories(): List<String> {
                  val list = mutableListOf<String>()
                  readableDatabase.rawQuery("SELECT info FROM memory", null).use { cursor ->
                      while (cursor.moveToNext()) { list.add(cursor.getString(0)) }
                  }
                  return list
              }

              fun addProject(name: String, desc: String) {
                  writableDatabase.use { db ->
                      val values = ContentValues().apply { put("name", name); put("description", desc) }
                      db.insert("projects", null, values)
                  }
              }

              fun getProjects(): List<String> {
                  val list = mutableListOf<String>()
                  readableDatabase.rawQuery("SELECT name, description FROM projects", null).use { cursor ->
                      while (cursor.moveToNext()) { list.add("📌 ${cursor.getString(0)}: ${cursor.getString(1)}") }
                  }
                  return list
              }

              fun addTask(title: String, status: String, result: String) {
                  writableDatabase.use { db ->
                      val values = ContentValues().apply {
                          put("title", title)
                          put("status", status)
                          put("result", result)
                      }
                      db.insert("background_tasks", null, values)
                  }
              }

              fun getTasks(): List<String> {
                  val list = mutableListOf<String>()
                  readableDatabase.rawQuery("SELECT title, status, result FROM background_tasks", null).use { cursor ->
                      while (cursor.moveToNext()) {
                          list.add("⚡ [${cursor.getString(1)}] ${cursor.getString(0)} — Res: ${cursor.getString(2)}")
                      }
                  }
                  return list
              }
          }
          EOF

          # Activity Principal com Abas Expandidas (Chat, Memória, Projetos, Tarefas BG, Configs)
          cat > proj/app/src/main/java/com/tomo/agentev8/MainActivity.kt <<'EOF'
          package com.tomo.agentev8

          import android.app.Activity
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.drawable.GradientDrawable
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.speech.tts.TextToSpeech
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import okhttp3.*
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.util.Locale

          class MainActivity : Activity(), TextToSpeech.OnInitListener {

              private lateinit var db: DatabaseHelper
              private lateinit var prefs: android.content.SharedPreferences
              private val client = OkHttpClient()
              private var tts: TextToSpeech? = null

              private lateinit var contentFrame: FrameLayout
              private lateinit var chatLayout: View
              private lateinit var memoryLayout: View
              private lateinit var projectsLayout: View
              private lateinit var tasksLayout: View
              private lateinit var settingsLayout: View

              private lateinit var chatContainer: LinearLayout
              private lateinit var chatScroll: ScrollView
              private lateinit var inputMessage: EditText

              private val chatHistory = mutableListOf<JSONObject>()
              private val VOICE_REQUEST_CODE = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  db = DatabaseHelper(this)
                  prefs = getSharedPreferences("v8_config", Context.MODE_PRIVATE)
                  tts = TextToSpeech(this, this)

                  val mainLayout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#090D16"))
                  }

                  val header = TextView(this).apply {
                      text = "⚡ AGENTE V8 — CORE SYSTEM"
                      textSize = 16f
                      setTextColor(Color.parseColor("#38BDF8"))
                      setBackgroundColor(Color.parseColor("#131B2E"))
                      setPadding(30, 25, 30, 25)
                      gravity = Gravity.CENTER
                  }
                  mainLayout.addView(header)

                  contentFrame = FrameLayout(this).apply {
                      layoutParams = LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f)
                  }
                  mainLayout.addView(contentFrame)

                  val navBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setBackgroundColor(Color.parseColor("#131B2E"))
                      setPadding(8, 8, 8, 8)
                  }

                  val btnChat = createNavButton("💬 Chat") { showView(chatLayout) }
                  val btnMem = createNavButton("🧠 Mem") { loadMemories(); showView(memoryLayout) }
                  val btnProj = createNavButton("📂 Proj") { loadProjects(); showView(projectsLayout) }
                  val btnTask = createNavButton("⚙️ Tarefas") { loadTasks(); showView(tasksLayout) }
                  val btnSet = createNavButton("🛠️ Conf") { showView(settingsLayout) }

                  navBar.addView(btnChat)
                  navBar.addView(btnMem)
                  navBar.addView(btnProj)
                  navBar.addView(btnTask)
                  navBar.addView(btnSet)
                  mainLayout.addView(navBar)

                  initChatView()
                  initMemoryView()
                  initProjectsView()
                  initTasksView()
                  initSettingsView()

                  contentFrame.addView(chatLayout)
                  contentFrame.addView(memoryLayout)
                  contentFrame.addView(projectsLayout)
                  contentFrame.addView(tasksLayout)
                  contentFrame.addView(settingsLayout)

                  showView(chatLayout)
                  setContentView(mainLayout)

                  val systemPrompt = JSONObject().apply {
                      put("role", "user")
                      put("parts", JSONArray().put(JSONObject().put("text", "Você é o Agente V8, um agente pessoal autônomo para Android com suporte a tarefas em segundo plano e persistência.")))
                  }
                  chatHistory.add(systemPrompt)
              }

              private fun createNavButton(text: String, onClick: () -> Unit): Button {
                  return Button(this).apply {
                      this.text = text
                      textSize = 11f
                      setTextColor(Color.WHITE)
                      background = createRoundedDrawable("#1E293B", "#38BDF8", 12)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f).apply { marginEnd = 3 }
                      setOnClickListener { onClick() }
                  }
              }

              private fun showView(view: View) {
                  chatLayout.visibility = View.GONE
                  memoryLayout.visibility = View.GONE
                  projectsLayout.visibility = View.GONE
                  tasksLayout.visibility = View.GONE
                  settingsLayout.visibility = View.GONE
                  view.visibility = View.VISIBLE
              }

              private fun initChatView() {
                  val layout = RelativeLayout(this)
                  chatScroll = ScrollView(this).apply { isFillViewport = true }
                  chatContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(30, 30, 30, 30)
                  }
                  chatScroll.addView(chatContainer)

                  val bottomBar = LinearLayout(this).apply {
                      id = View.generateViewId()
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(20, 20, 20, 20)
                      setBackgroundColor(Color.parseColor("#131B2E"))
                  }

                  inputMessage = EditText(this).apply {
                      hint = "Comande o V8..."
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      background = createRoundedDrawable("#1E293B", "#334155", 30)
                      setPadding(30, 20, 30, 20)
                      layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  }

                  val btnVoice = Button(this).apply {
                      text = "🎙️"
                      background = createRoundedDrawable("#0284C7", "#38BDF8", 40)
                      layoutParams = LinearLayout.LayoutParams(100, 100).apply { leftMargin = 10 }
                      setOnClickListener { startVoiceInput() }
                  }

                  val btnSend = Button(this).apply {
                      text = "➔"
                      setTextColor(Color.WHITE)
                      background = createRoundedDrawable("#2563EB", "#60A5FA", 40)
                      layoutParams = LinearLayout.LayoutParams(100, 100).apply { leftMargin = 10 }
                      setOnClickListener { sendMessage() }
                  }

                  bottomBar.addView(inputMessage)
                  bottomBar.addView(btnVoice)
                  bottomBar.addView(btnSend)

                  val bottomParams = RelativeLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      addRule(RelativeLayout.ALIGN_PARENT_BOTTOM)
                  }
                  val scrollParams = RelativeLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT).apply {
                      addRule(RelativeLayout.ABOVE, bottomBar.id)
                  }

                  layout.addView(chatScroll, scrollParams)
                  layout.addView(bottomBar, bottomParams)
                  chatLayout = layout

                  addMessageToChat("V8: Subsistema operacional ativo. Pronto para comandos em segundo plano.", false)
              }

              private fun sendMessage() {
                  val text = inputMessage.text.toString().trim()
                  if (text.isEmpty()) return

                  val apiKey = prefs.getString("api_key", "") ?: ""
                  if (apiKey.isEmpty()) {
                      Toast.makeText(this, "Configure sua Chave API!", Toast.LENGTH_LONG).show()
                      showView(settingsLayout)
                      return
                  }

                  addMessageToChat(text, true)
                  inputMessage.setText("")

                  val userObj = JSONObject().apply {
                      put("role", "user")
                      put("parts", JSONArray().put(JSONObject().put("text", text)))
                  }
                  chatHistory.add(userObj)
                  
                  // Regista tarefa na fila simulando background task
                  db.addTask(text, "Executando", "Processando na API...")
                  callGeminiApi(apiKey, text)
              }

              private fun callGeminiApi(apiKey: String, userText: String) {
                  val selectedModel = prefs.getString("selected_model", "gemini-2.5-flash") ?: "gemini-2.5-flash"
                  val url = "https://generativelanguage.googleapis.com/v1beta/models/$selectedModel:generateContent?key=$apiKey"

                  val jsonBody = JSONObject().apply { put("contents", JSONArray(chatHistory)) }
                  val body = jsonBody.toString().toRequestBody("application/json; charset=utf-8".toMediaType())

                  val request = Request.Builder().url(url).post(body).build()

                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          runOnUiThread {
                              db.addTask(userText, "Erro", e.message ?: "Falha de rede")
                              addMessageToChat("Erro de conexão: ${e.message}", false)
                          }
                      }

                      override fun onResponse(call: Call, response: Response) {
                          val resText = response.body?.string()
                          runOnUiThread {
                              try {
                                  val json = JSONObject(resText ?: "")
                                  val reply = json.getJSONArray("candidates").getJSONObject(0).getJSONObject("content").getJSONArray("parts").getJSONObject(0).getString("text")

                                  val modelObj = JSONObject().apply {
                                      put("role", "model")
                                      put("parts", JSONArray().put(JSONObject().put("text", reply)))
                                  }
                                  chatHistory.add(modelObj)
                                  db.addTask(userText, "Concluído", "Sucesso")
                                  addMessageToChat(reply, false)
                                  speakOut(reply)
                              } catch (e: Exception) {
                                  db.addTask(userText, "Erro", "Resposta inválida")
                                  addMessageToChat("Erro ao processar resposta.", false)
                              }
                          }
                      }
                  })
              }

              private fun addMessageToChat(msg: String, isUser: Boolean) {
                  val tv = TextView(this).apply {
                      text = msg
                      textSize = 14f
                      setTextColor(Color.WHITE)
                      setPadding(30, 20, 30, 20)
                      background = createRoundedDrawable(if (isUser) "#2563EB" else "#1E293B", if (isUser) "#3B82F6" else "#334155", 25)
                  }
                  val params = LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      gravity = if (isUser) Gravity.END else Gravity.START
                      topMargin = 15
                  }
                  chatContainer.addView(tv, params)
                  chatScroll.post { chatScroll.fullScroll(View.FOCUS_DOWN) }
              }

              private lateinit var memoryContainer: LinearLayout
              private fun initMemoryView() {
                  val scroll = ScrollView(this)
                  memoryContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40) }
                  scroll.addView(memoryContainer)
                  memoryLayout = scroll
              }

              private fun loadMemories() {
                  memoryContainer.removeAllViews()
                  memoryContainer.addView(TextView(this).apply { text = "🧠 Memória Persistente"; textSize = 18f; setTextColor(Color.WHITE) })
                  val input = EditText(this).apply { hint = "Novo registo..."; setHintTextColor(Color.GRAY); setTextColor(Color.WHITE) }
                  val btn = Button(this).apply {
                      text = "Salvar na Memória"
                      setTextColor(Color.WHITE)
                      background = createRoundedDrawable("#2563EB", "#60A5FA", 20)
                      setOnClickListener { if (input.text.isNotEmpty()) { db.addMemory(input.text.toString()); input.setText(""); loadMemories() } }
                  }
                  memoryContainer.addView(input); memoryContainer.addView(btn)
                  db.getMemories().forEach { memoryContainer.addView(TextView(this).apply { text = "• $memoryContainer"; setTextColor(Color.LTGRAY); setPadding(0, 15, 0, 0) }) }
              }

              private lateinit var projectsContainer: LinearLayout
              private fun initProjectsView() {
                  val scroll = ScrollView(this)
                  projectsContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40) }
                  scroll.addView(projectsContainer)
                  projectsLayout = scroll
              }

              private fun loadProjects() {
                  projectsContainer.removeAllViews()
                  projectsContainer.addView(TextView(this).apply { text = "📂 Gestor de Projetos"; textSize = 18f; setTextColor(Color.WHITE) })
                  val name = EditText(this).apply { hint = "Nome do Projeto"; setHintTextColor(Color.GRAY); setTextColor(Color.WHITE) }
                  val desc = EditText(this).apply { hint = "Descrição / Código"; setHintTextColor(Color.GRAY); setTextColor(Color.WHITE) }
                  val btn = Button(this).apply {
                      text = "Criar Projeto"
                      setTextColor(Color.WHITE)
                      background = createRoundedDrawable("#2563EB", "#60A5FA", 20)
                      setOnClickListener { if (name.text.isNotEmpty()) { db.addProject(name.text.toString(), desc.text.toString()); name.setText(""); desc.setText(""); loadProjects() } }
                  }
                  projectsContainer.addView(name); projectsContainer.addView(desc); projectsContainer.addView(btn)
                  db.getProjects().forEach { projectsContainer.addView(TextView(this).apply { text = it; setTextColor(Color.LTGRAY); setPadding(0, 20, 0, 0) }) }
              }

              // --- PAINEL DE TAREFAS EM SEGUNDO PLANO ---
              private lateinit var tasksContainer: LinearLayout
              private fun initTasksView() {
                  val scroll = ScrollView(this)
                  tasksContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40) }
                  scroll.addView(tasksContainer)
                  tasksLayout = scroll
              }

              private fun loadTasks() {
                  tasksContainer.removeAllViews()
                  tasksContainer.addView(TextView(this).apply { text = "⚙️ Painel de Tarefas (Background)"; textSize = 18f; setTextColor(Color.WHITE) })
                  db.getTasks().forEach {
                      tasksContainer.addView(TextView(this).apply { text = it; setTextColor(Color.CYAN); setPadding(0, 15, 0, 0) })
                  }
              }

              private fun initSettingsView() {
                  val scroll = ScrollView(this)
                  val container = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(40, 40, 40, 40) }
                  container.addView(TextView(this).apply { text = "🛠️ Configurações & API"; textSize = 18f; setTextColor(Color.WHITE) })

                  val keyInput = EditText(this).apply {
                      hint = "Chave API do Gemini"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      inputType = InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                      setText(prefs.getString("api_key", "") ?: "")
                  }
                  container.addView(keyInput)

                  val models = arrayOf("gemini-2.5-flash", "gemini-2.5-pro", "gemini-3.0-flash", "gemini-3.0-pro")
                  val spinner = Spinner(this).apply { adapter = ArrayAdapter(this@MainActivity, android.R.layout.simple_spinner_dropdown_item, models) }
                  container.addView(spinner)

                  val btnSave = Button(this).apply {
                      text = "Guardar Configurações"
                      setTextColor(Color.WHITE)
                      background = createRoundedDrawable("#2563EB", "#60A5FA", 20)
                      setOnClickListener {
                          prefs.edit().putString("api_key", keyInput.text.toString().trim()).putString("selected_model", spinner.selectedItem.toString()).apply()
                          Toast.makeText(this@MainActivity, "Salvo!", Toast.LENGTH_SHORT).show()
                          showView(chatLayout)
                      }
                  }
                  container.addView(btnSave)
                  scroll.addView(container)
                  settingsLayout = scroll
              }

              private fun startVoiceInput() {
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault())
                  }
                  try { startActivityForResult(intent, VOICE_REQUEST_CODE) } catch (e: Exception) {}
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == VOICE_REQUEST_CODE && resultCode == RESULT_OK) {
                      val result = data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                      if (!result.isNullOrEmpty()) { inputMessage.setText(result[0]); sendMessage() }
                  }
              }

              override fun onInit(status: Int) { if (status == TextToSpeech.SUCCESS) tts?.language = Locale("pt", "BR") }
              private fun speakOut(text: String) { tts?.speak(text.replace(Regex("[*`#_]"), ""), TextToSpeech.QUEUE_FLUSH, null, null) }
              private fun createRoundedDrawable(bg: String, stroke: String, rad: Int): GradientDrawable {
                  return GradientDrawable().apply { setColor(Color.parseColor(bg)); setStroke(3, Color.parseColor(stroke)); cornerRadius = rad.toFloat() }
              }
              override fun onDestroy() { tts?.stop(); tts?.shutdown(); super.onDestroy() }
          }
          EOF

      - name: Gerar Gradle Wrapper e Compilar APK
        shell: bash
        run: |
          cd proj
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK na aba Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.5-${{ github.run_number }}
          name: "Agente V8 - Background & Core Versão ${{ github.run_number }}"
          body: "Versão com painel de tarefas em segundo plano, registo de filas no SQLite, abas expandidas e integração total ao Gemini."
          files: proj/app/build/outputs/apk/debug/app-debug.apk
