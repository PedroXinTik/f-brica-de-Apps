          package com.tomo.agentev8
          import android.app.Service
          import android.content.Intent
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.IBinder
          import android.provider.Settings
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          class FloatingBubbleService : Service() {
              private lateinit var wm: WindowManager
              private var bubble: TextView? = null
              override fun onCreate() {
                  super.onCreate()
                  if (!Settings.canDrawOverlays(this)) {
                      stopSelf()
                      return
                  }
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  showBubble()
              }
              private fun showBubble() {
                  val view = TextView(this).apply {
                      text = "V8"
                      textSize = 16f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setBackgroundColor(Color.rgb(37, 99, 235))
                  }
                  val type = if (android.os.Build.VERSION.SDK_INT >= 26) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      WindowManager.LayoutParams.TYPE_PHONE
                  }
                  val params = WindowManager.LayoutParams(
                      140,
                      140,
                      type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 20
                      y = 300
                  }
                  var downX = 0f
                  var downY = 0f
                  var startX = 0
                  var startY = 0
                  view.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              downX = event.rawX
                              downY = event.rawY
                              startX = params.x
                              startY = params.y
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = startX + (event.rawX - downX).toInt()
                              params.y = startY + (event.rawY - downY).toInt()
                              wm.updateViewLayout(view, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (kotlin.math.abs(event.rawX - downX) < 15 &&
                                  kotlin.math.abs(event.rawY - downY) < 15) {
                                  openMain()
                              }
                              true
                          }
                          else -> false
                      }
                  }
                  bubble = view
                  wm.addView(view, params)
              }
              private fun openMain() {
                  Toast.makeText(this, "Abrindo Agente V8", Toast.LENGTH_SHORT).show()
                  startActivity(
                      Intent(this, MainActivity::class.java).addFlags(
                          Intent.FLAG_ACTIVITY_NEW_TASK
                      )
                  )
              }
              override fun onDestroy() {
                  bubble?.let {
                      try { wm.removeView(it) } catch (_: Exception) {}
                  }
                  bubble = null
                  super.onDestroy()
              }
              override fun onBind(intent: Intent?): IBinder? = null
          }
