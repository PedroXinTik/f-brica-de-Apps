          package com.tomo.agentev8
          import android.content.Context
          class MemoryManager(context: Context) {
              private val db = DatabaseHelper(context.applicationContext)
              fun save(text: String) = db.addMemory(text)
              fun saveIfUseful(text: String) {
                  val lower = text.lowercase()
                  if (lower.startsWith("lembre") ||
                      lower.startsWith("lembra") ||
                      lower.contains("guarde isso")
                  ) {
                      save(text)
                  }
              }
              fun all(): List<String> = db.getMemories()
              fun buildContext(maxItems: Int = 12): String {
                  return all().take(maxItems).joinToString("\n") { "- $it" }
              }
          }
