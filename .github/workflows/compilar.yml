          cat > proj/app/src/main/java/com/tomo/agentev8/EvolutionLabManager.kt <<'EOF'
          package com.tomo.agentev8
          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import kotlin.math.abs
          import kotlin.random.Random
          import java.util.concurrent.Executors
          import java.util.concurrent.Future
          class EvolutionLabManager(context: Context) {
              private val db = DatabaseHelper(context.applicationContext)
              private val executor = Executors.newSingleThreadExecutor()
              private val main = Handler(Looper.getMainLooper())
              private var future: Future<*>? = null
              @Volatile
              var running: Boolean = false
                  private set
              fun train(
                  goal: String,
                  generations: Int = 25,
                  callback: (generation: Int, score: Double) -> Unit,
                  finished: (best: Double) -> Unit
              ) {
                  stop()
                  val total = generations.coerceIn(1, 500)
                  running = true
                  future = executor.submit {
                      var best = 0.0
                      for (generation in 1..total) {
                          if (!running) break
                          val score = evaluate(goal, generation)
                          if (score > best) best = score
                          db.addEvolution(goal, score, generation)
                          main.post { callback(generation, score) }
                          Thread.sleep(70)
                      }
                      running = false
                      main.post { finished(best) }
                  }
              }
              private fun evaluate(goal: String, generation: Int): Double {
                  val target = (goal.length.coerceAtLeast(1) % 100) / 100.0
                  val noise = Random.nextDouble(0.0, 0.35)
                  val progress = (generation / 100.0).coerceAtMost(0.65)
                  return (1.0 - abs(target - progress) + noise).coerceIn(0.0, 1.0)
              }
              fun stop() {
                  running = false
                  future?.cancel(true)
                  future = null
              }
              fun history(): List<String> = db.getEvolution()
              fun release() {
                  stop()
                  executor.shutdownNow()
              }
          }
          EOF
          cat > proj/app/src/main/java/com/tomo/agentev8/AIManager.kt <<'EOF'
          package com.tomo.agentev8
          import okhttp3.Call
          import okhttp3.Callback
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import okhttp3.MediaType.Companion.toMediaType
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          class AIManager(
              private val client: OkHttpClient = OkHttpClient()
          ) {
              fun askGemini(
                  apiKey: String,
                  model: String,
                  prompt: String,
                  memoryContext: String,
                  history: List<Pair<String, String>>,
                  callback: (String?, String?) -> Unit
              ) {
                  if (apiKey.isBlank()) {
                      callback(null, "Chave API não configurada.")
                      return
                  }
                  val contents = JSONArray()
                  val system = JSONObject().apply {
                      put("role", "user")
                      put(
                          "parts",
                          JSONArray().put(
                              JSONObject().put(
                                  "text",
                                  "Você é o Agente V8, assistente pessoal Android. " +
                                  "Seja útil, direto e seguro. Memórias disponíveis:\n$memoryContext"
                              )
                          )
                      )
                  }
                  contents.put(system)
                  history.forEach { pair ->
                      contents.put(JSONObject().apply {
                          put("role", if (pair.first == "model") "model" else "user")
                          put("parts", JSONArray().put(JSONObject().put("text", pair.second)))
                      })
                  }
                  contents.put(JSONObject().apply {
                      put("role", "user")
                      put("parts", JSONArray().put(JSONObject().put("text", prompt)))
                  })
                  val body = JSONObject()
                      .put("contents", contents)
                      .toString()
                      .toRequestBody("application/json; charset=utf-8".toMediaType())
                  val url =
                      "https://generativelanguage.googleapis.com/v1beta/models/" +
                      "$model:generateContent?key=$apiKey"
                  val request = Request.Builder()
                      .url(url)
                      .post(body)
                      .build()
                  client.newCall(request).enqueue(object : Callback {
                      override fun onFailure(call: Call, e: IOException) {
                          callback(null, e.message ?: "Falha de rede.")
                      }
                      override fun onResponse(call: Call, response: okhttp3.Response) {
                          response.use {
                              val raw = it.body?.string().orEmpty()
                              if (!it.isSuccessful) {
                                  callback(null, "API HTTP ${it.code}: ${parseError(raw)}")
                                  return
                              }
                              try {
                                  val text = JSONObject(raw)
                                      .getJSONArray("candidates")
                                      .getJSONObject(0)
                                      .getJSONObject("content")
                                      .getJSONArray("parts")
                                      .getJSONObject(0)
                                      .getString("text")
                                  callback(text, null)
                              } catch (e: Exception) {
                                  callback(null, "Resposta inesperada da API.")
                              }
                          }
                      }
                  })
              }
              private fun parseError(raw: String): String {
                  return try {
                      JSONObject(raw).optJSONObject("error")
                          ?.optString("message")
                          ?: "Erro desconhecido"
                  } catch (_: Exception) {
                      "Erro desconhecido"
                  }
              }
          }
